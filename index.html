<!doctype html>
<html lang="en">

<head>
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="/favicon-48x48.png" sizes="48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- SEO Meta Tags -->
  <title>Xplore Xperience</title>

  <meta name="keywords"
    content="northeast india travel, meghalaya packages, tawang tour, arunachal pradesh travel, sikkim packages, assam tourism, kaziranga safari, nagaland hornbill festival, shillong tour, living root bridges, himalayan travel, northeast tour packages, adventure travel india, verified travel guides, bike rentals northeast, dzukou valley trek" />

  <meta name="author" content="Xplore Xperience" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <!-- Open Graph / Facebook Base -->
  <meta property="og:image" content="https://xplorexp.in/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Xplore Xperience" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card Base -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://xplorexp.in/og-image.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet" />

  <!-- Structured Data - Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "TravelAgency",
    "name": "Xplore Xperience",
    "alternateName": "Xplore Xp",
    "url": "https://xplorexp.in",
    "logo": "https://xplorexp.in/logo.png",
    "description": "Premium travel agency specializing in Northeast India tour packages with verified guides and trusted drivers.",
    "address": {
      "@type": "PostalAddress",
      "addressRegion": "Northeast India",
      "addressCountry": "IN"
    },
    "telephone": "+91-918-131-7151",
    "priceRange": "$$",
    "areaServed": [
      {
        "@type": "State",
        "name": "Meghalaya"
      },
      {
        "@type": "State",
        "name": "Arunachal Pradesh"
      },
      {
        "@type": "State",
        "name": "Sikkim"
      },
      {
        "@type": "State",
        "name": "Assam"
      },
      {
        "@type": "State",
        "name": "Nagaland"
      }
    ],
    "sameAs": [
      "https://wa.me/919181317151"
    ]
  }
  </script>

  <!-- Structured Data - WebSite -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Xplore Xperience",
    "url": "https://xplorexp.in",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://xplorexp.in/packages?search={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Structured Data - Service -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Service",
    "serviceType": "Travel Tour Packages",
    "provider": {
      "@type": "TravelAgency",
      "name": "Xplore Xperience"
    },
    "areaServed": {
      "@type": "Place",
      "name": "Northeast India"
    },
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Travel Packages",
      "itemListElement": [
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "TouristTrip",
            "name": "Meghalaya Tour Package",
            "description": "Land of waterfalls, living root bridges and crystal-clear rivers"
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "TouristTrip",
            "name": "Tawang Tour Package",
            "description": "Ancient monasteries, high passes and alpine lakes in Arunachal Pradesh"
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "TouristTrip",
            "name": "Sikkim Tour Package",
            "description": "Snow peaks, monasteries and pristine lakes"
          }
        }
      ]
    }
  }
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
